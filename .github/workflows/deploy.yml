name: Deploy to GitHub Pages

# Builds the static app and publishes it to GitHub Pages. The URL-import
# serverless function is not available on Pages (static hosting), so URL import
# is disabled there; every other feature works in local mode. For the full app
# (including URL import and Supabase), deploy to Vercel or Netlify instead.

on:
  push:
    branches: [claude/memory-palace-app-h2rzaz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Serve under https://<user>.github.io/Memory-App/
          BASE_PATH: /Memory-App/
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Enable Pages automatically (no manual Settings -> Pages step needed).
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
