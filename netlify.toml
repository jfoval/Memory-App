[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Make the client-side path identical to Vercel (/api/import).
[[redirects]]
  from = "/api/import"
  to = "/.netlify/functions/import"
  status = 200

# SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
